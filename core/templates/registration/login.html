{% extends "core/base.html" %}
{% block title %}Log in - CAS{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto;">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue</p>
  {% if form.errors %}<p class="red">Wrong username or password. Please try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus required style="width:100%;margin-bottom:12px;">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required style="width:100%;margin-bottom:16px;">
    <button class="btn" type="submit" style="width:100%;">Log in</button>
  </form>
</div>
{% endblock %}
